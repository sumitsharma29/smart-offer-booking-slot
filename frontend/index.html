<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SmartSlot – Premium Flash Offer Booking</title>
    <meta name="description" content="SmartSlot is a concurrency-secured, real-time booking platform for premium flash discount slots at spas, restaurants, gyms, and clinics. Lock your seat before it's gone." />
    <meta name="keywords" content="flash offer, slot booking, discount, spa, gym, restaurant, real-time, booking system" />

    <!-- Start Single Page Apps for GitHub Pages Option -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState.
      (function(l) {
        if (l.search[0] === '?') {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages Option -->

    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="SmartSlot – Premium Flash Offer Booking" />
    <meta property="og:description" content="Book exclusive discount slots at premium venues, secured in real-time against double-booking." />
    <meta property="og:type" content="website" />

    <!-- Outfit & Inter Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- PWA Configurations -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartSlot" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SmartSlot SW registered.', reg.scope))
            .catch(err => console.warn('SmartSlot SW registration failed: ', err));
        });
      }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
