<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SmartSlot – Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts it into a path and query string,
      // then redirects the browser to the new url with the path and query string as parameters.
      // The index.html page will then parse these parameters and restore the path.

      // Set this to 1 to match the single repository subdirectory: "/smart-offer-booking-slot"
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?p=' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- Redirecting client router... -->
  </body>
</html>
